# =============================================================================
#  Các nhóm thông tin (nhóm quản trị) của portal
#
#  Danh sách cố định, khai trong mã nguồn — không tạo hay xoá nhóm thông tin từ giao
#  diện. Mỗi lần khởi động, portal ghi danh sách này vào sổ tay.
#
#    code      mã nhóm thông tin, dùng trên URL. 2–20 ký tự in hoa, số hoặc dấu `-`.
#              Không đổi sau khi đã có dữ liệu.
#    name      tên hiển thị ở ô chọn nhóm thông tin.
#    forms     mã bộ bảng (`form.code` trong `registry/forms/*.yaml`) mà nhóm thông tin
#              nhận dữ liệu — một mã, hoặc danh sách mã khi nhóm có nhiều loại tệp
#              (thứ tự trong danh sách là thứ tự ở ô chọn Loại tệp). Bỏ trống khi
#              chưa có bộ bảng: nhóm thông tin vẫn hiện trong ô chọn nhưng chưa nạp
#              được. Mỗi bộ bảng thuộc tối đa một nhóm thông tin. Không đổi bộ bảng
#              của nhóm thông tin đã có dữ liệu.
#
#  Bỏ một nhóm thông tin khỏi danh sách thì nhóm thông tin đó bị ẩn, dữ liệu đã nạp giữ nguyên.
# =============================================================================

domains:
  - code: HQKD
    name: Hiệu quả kinh doanh theo nhóm và khách hàng
    forms: BAO_CAO_HQKH

  - code: HQ-MAU-GC
    name: Hiệu quả may mẫu chào hàng, gia công ngoài
    forms: [LICH_MAY_MAU, DON_GIA_CONG]
