# =============================================================================
#  Bộ bảng LICH_MAY_MAU — Lịch may mẫu (nhóm HQ-MAU-GC)
#
#  Tệp NBC: "SAMPLE MAKING SCHEDULE ( 30 Sep ) - OK.xlsx". Bộ đọc
#  `sources/header_table.py` nhận sheet **theo dòng tiêu đề**, không theo
#  tên (tên sheet đổi theo ngày): sheet đang hiện có đủ 7 cột cần lấy. Dữ liệu
#  từ dòng tiêu đề + 3 (dòng tiêu đề tiếng Anh, một dòng trống) tới trước dòng
#  trống đầu tiên, đọc cả dòng ẩn, bỏ dòng tổng (QT-16).
#
#  Cột theo phiếu khảo sát 20260915_NBC-QTTM_Bieu_mau_du_lieu_va_Khao_sat sheet
#  "4. May mau" (Bảng C) và đặc tả mục 10.3. Cột trong phiếu mà tệp không có thì
#  giữ cột, để trống (`value_from: trong`, QT-21). Cột của tệp không có trong phiếu
#  không nạp (10.4).
#
#  Nạp lại cùng năm: ghi đè toàn bộ (`merge: replace_all`, QT-10) — tệp là bản
#  theo dõi luỹ kế, mỗi bản liệt kê lại mọi dòng.
# =============================================================================

form:
  code: LICH_MAY_MAU
  version: 1
  label: Lịch may mẫu
  subtitle: SAMPLE MAKING SCHEDULE
  description: Lịch may mẫu chào hàng — từng lần may mẫu, số lượng và đơn giá.
  policy:
    unknown_sheet: ignore
    unknown_column: ignore
  source:
    kind: bang_theo_tieu_de
    data_row_offset: 3           # dữ liệu bắt đầu ở dòng tiêu đề + 3 (dòng 14 khi tiêu đề ở dòng 11)
    total_cell: P10              # ô SUBTOTAL — chỉ cộng dòng đang hiện, chỉ ghi nhận (QT-14)
    total_cell_informational: true
    report_date_cell: A4         # "DATE : 30 Sep 2026" — ngày của bản theo dõi
    # Thứ tự cột cần lấy như trong tệp — dùng ở câu báo lỗi (đặc tả 5.1, 15.5).
    required_headers: [KHÁCH HÀNG, MÃ HÀNG, LOẠI MẪU, SALE, SỐ LƯỢNG, NGÀY GIAO MẪU (QC), GIÁ TIỀN (USD)]

tables:
  - name: fact_may_mau
    kind: fact
    sheet: LICH_MAY_MAU
    label: May mẫu chào hàng
    card_label: May mẫu chào hàng
    description: Từng lần may mẫu, số lượng và chi phí.
    grain: Một dòng cho mỗi lần may mẫu (một dòng dữ liệu của sheet lịch may mẫu).
    purpose: >
      Nhóm câu hỏi về hiệu quả may mẫu chào hàng: chi phí may mẫu so với doanh thu và
      lợi nhuận, khách hàng hoặc mẫu chưa phát sinh đơn hàng, tỷ lệ mẫu chuyển thành
      đơn hàng.
    business_key: [nam, ma_mau]
    merge: replace_all
    order: [nam, ngay_giao_mau, ma_mau]
    display_order: 1
    columns:
      - name: nam
        type: int
        value_from: nam_du_lieu
        label: Không có trong tệp — lấy từ ô Năm dữ liệu chọn lúc nạp
        meaning: Năm của số liệu, chọn ở ô Năm dữ liệu lúc nạp.
        example: "2026"
      - name: ma_lan_may
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Mã riêng của một lần may mẫu. Tệp không có cột này (STT và #ID của tệp đều có số lặp) nên để trống.
      - name: ngay_giao_mau
        type: date
        header: NGÀY GIAO MẪU (QC)
        label: NGÀY GIAO MẪU (QC)
        meaning: Ngày mẫu được giao, dùng để xác định mẫu thuộc kỳ nào. Ô không đọc được ngày thì để trống.
        example: "01/06/2026"
      - name: ma_khach
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Mã khách hàng mà mẫu được chào cho. Tệp chỉ có tên khách nên để trống.
      - name: ten_khach
        type: text
        header: KHÁCH HÀNG
        label: KHÁCH HÀNG
        display_width: 240
        meaning: Tên khách hàng mà mẫu được chào cho.
        example: APG
      - name: ma_nhom_kd
        type: text
        header: SALE
        label: SALE
        meaning: Nhóm kinh doanh phụ trách, giữ nguyên giá trị trong tệp.
        example: "6"
      - name: ma_mau
        type: text
        required: true
        header: MÃ HÀNG
        label: MÃ HÀNG
        display_width: 240
        meaning: Mã của mẫu, dùng để trả lời câu hỏi mẫu nào đã phát sinh chi phí nhưng chưa có đơn hàng.
        example: 120964 IVY LINEN BLAZER
      - name: ma_giai_doan_mau
        type: text
        header: LOẠI MẪU
        label: LOẠI MẪU
        meaning: Giai đoạn của mẫu trong quy trình chào hàng.
        example: DEVELOP
      - name: so_luong
        type: number
        role: measure
        header: SỐ LƯỢNG
        label: SỐ LƯỢNG
        meaning: Số lượng mẫu của lần may này.
        example: "6"
      - name: don_gia
        type: number
        header: GIÁ TIỀN (USD)
        label: GIÁ TIỀN (USD)
        meaning: Đơn giá của một mẫu. Ô không đọc được số thì để trống.
        example: "37.5"
      - name: ma_tien_te
        type: text
        value_from: tieu_de
        header: GIÁ TIỀN (USD)
        label: Tiêu đề cột GIÁ TIỀN (USD)
        meaning: Đơn vị tiền của đơn giá, lấy trong tiêu đề cột GIÁ TIỀN (USD) — luôn là USD.
        example: USD
      - name: ma_po_phat_sinh
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Mã đơn hàng phát sinh từ mẫu này. Tệp không có cột này nên để trống.
