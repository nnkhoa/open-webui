# =============================================================================
#  Bộ bảng DON_GIA_CONG — Gia công ngoài (nhóm HQ-MAU-GC)
#
#  Tệp NBC: "TOTAL PO SUBCON.xlsx". Bộ đọc `sources/header_table.py` nhận sheet
#  đang hiện **theo dòng tiêu đề**: dòng có đủ 5 tên cột dưới đây (dòng 2). Sheet ẩn
#  không tính. Dữ liệu từ dòng ngay dưới dòng tiêu đề; bỏ dòng ẩn, dừng ở dòng đang
#  hiện trống đầu tiên. Dòng 1 là các ô tổng (SUBTOTAL), chỉ dùng để đối chiếu.
#
#  Chỉ lấy các cột chứa thông tin NBC hiện cần: Subcon, Location, BUYER,
#  Order qty, Actual cut. Tên biến theo phiếu khảo sát sheet "5. Gia cong ngoai"
#  và "6. Danh muc"; cột phiếu chưa có tên thì giữ tên cột gốc (location, actual_cut).
#
#  Bronze giữ y như tệp. Silver làm sạch chữ, ô chữ trống → "Không có thông tin",
#  và đổi tên khách sang mã theo definitions/customer_aliases.yaml.
#
#  Ô P1 (SUBTOTAL của cột Order qty) phải bằng tổng so_luong.
#  ky_thang lấy từ ô Tháng dữ liệu chọn lúc nạp (bắt buộc), chỉ ghi nhận tháng.
#  Nạp lại cùng năm: ghi đè toàn bộ năm đó (`merge: replace_all`).
# =============================================================================

form:
  code: DON_GIA_CONG
  version: 3
  label: Gia công ngoài
  subtitle: TOTAL PO SUBCON
  description: Đơn giao xưởng gia công ngoài — đơn vị gia công, khu vực, khách hàng, số lượng đặt và đã cắt.
  policy:
    unknown_sheet: ignore
    unknown_column: ignore
  source:
    kind: header_table
    data_row_offset: 1
    total_cell: P1
    required_headers: [Subcon, Location, BUYER, Order qty, Actual cut]

tables:
  - name: fact_gia_cong
    kind: fact
    sheet: DON_GIA_CONG
    label: Đơn gia công ngoài
    card_label: Đơn gia công ngoài
    description: Từng dòng đơn giao xưởng gia công — số lượng đặt và số lượng đã cắt.
    grain: Một dòng cho mỗi dòng dữ liệu đang hiện của sheet đơn gia công.
    purpose: >
      Nhóm câu hỏi về hiệu quả gia công ngoài: tổng sản lượng và số đơn vị gia công
      trong kỳ, theo khu vực và theo khách hàng.
    business_key: [nam, ma_don_vi_gc, ma_khach]
    merge: replace_all
    order: [nam, ma_don_vi_gc, ma_khach]
    display_order: 1
    columns:
      - name: nam
        type: int
        value_from: nam_du_lieu
        label: Không có trong tệp — lấy từ ô Năm dữ liệu chọn lúc nạp
        meaning: Năm của số liệu, chọn ở ô Năm dữ liệu lúc nạp.
        example: "2026"
      - name: ky_thang
        type: int
        value_from: thang_du_lieu
        label: Không có trong tệp — lấy từ ô Tháng dữ liệu chọn lúc nạp
        meaning: Tháng của số liệu, chọn ở ô Tháng dữ liệu lúc nạp.
        example: "9"
      - name: ma_don_vi_gc
        type: text
        required: true
        header: Subcon
        label: Subcon
        display_width: 200
        normalize: clean_text
        meaning: Đơn vị gia công nhận đơn.
        example: TNT
      - name: location
        type: text
        header: Location
        label: Location
        normalize: clean_text
        meaning: Khu vực của đơn vị gia công.
        example: BINH DUONG
      - name: ma_khach
        type: text
        header: BUYER
        label: BUYER
        normalize: customer_code
        meaning: >
          Mã khách hàng của đơn. Tên trong tệp được đổi sang mã theo danh mục tên gọi khác
          của khách hàng; tên chưa có mã giữ nguyên.
        example: EO-00075
      - name: so_luong
        type: number
        role: measure
        header: Order qty
        label: Order qty
        meaning: Số lượng sản phẩm đặt của dòng đơn.
        example: "2802"
      - name: actual_cut
        type: number
        role: measure
        header: Actual cut
        label: Actual cut
        meaning: Số lượng sản phẩm đã cắt của dòng đơn. Ô trống thì để trống.
        example: "2802"
