# =============================================================================
#  Bộ bảng LICH_MAY_MAU — May mẫu (nhóm HQ-MAU-GC)
#
#  Tệp NBC: "THONG KE MAY MAU 2026 - FPT.xlsx" — một sheet, bảng phẳng. Bộ đọc
#  `sources/header_table.py` nhận sheet đang hiện **theo dòng tiêu đề**: dòng có đủ
#  9 tên cột dưới đây (dòng 2). Dữ liệu từ dòng tiêu đề + 1; bỏ dòng ẩn, dừng ở dòng
#  đang hiện trống đầu tiên, bỏ dòng tổng.
#
#  Lấy đủ 9 cột của tệp, giá trị y như tệp. Tên cột là tên tiêu đề của tệp viết
#  dạng snake_case không dấu.
#
#  Bronze giữ y như tệp. Silver chỉ gộp khoảng trắng, xuống dòng của ô chữ
#  (`clean_text`; ô chữ trống → "Không có thông tin") và đổi kiểu số.
#
#  nam lấy từ ô Năm dữ liệu chọn lúc nạp. Nạp lại cùng năm: ghi đè toàn bộ năm đó
#  (`merge: replace_all`).
# =============================================================================

form:
  code: LICH_MAY_MAU
  version: 8
  label: May mẫu
  subtitle: THONG KE MAY MAU
  description: Thống kê may mẫu chào hàng — tháng, nhóm, khách hàng, mẫu, đơn giá, số lượng và thành tiền.
  policy:
    unknown_sheet: ignore
    unknown_column: ignore
  source:
    kind: header_table
    data_row_offset: 1
    required_headers: [THÁNG, NHÓM, KHÁCH HÀNG, MEN / LADY / OTHERS, SAMPLE DESCRIPTION, ĐƠN GIÁ, SỐ LƯỢNG,
                       THÀNH TIỀN USD, THÀNH TIỀN VNĐ]

tables:
  - name: fact_may_mau
    kind: fact
    sheet: LICH_MAY_MAU
    label: May mẫu chào hàng
    card_label: May mẫu chào hàng
    description: Từng lần may mẫu — tháng, nhóm, khách hàng, mẫu, đơn giá, số lượng và thành tiền.
    grain: Một dòng cho mỗi dòng dữ liệu đang hiện của sheet thống kê may mẫu.
    purpose: >
      Nhóm câu hỏi về hiệu quả may mẫu chào hàng: chi phí may mẫu theo khách hàng và
      nhóm kinh doanh, so với doanh thu và lợi nhuận của cùng khách hàng ở nhóm HQKD.
    business_key: [nam, khach_hang, sample_description]
    merge: replace_all
    order: [nam, thang, nhom, khach_hang, sample_description]
    display_order: 1
    columns:
      - name: nam
        type: int
        value_from: nam_du_lieu
        label: Không có trong tệp — lấy từ ô Năm dữ liệu chọn lúc nạp
        meaning: Năm của số liệu, chọn ở ô Năm dữ liệu lúc nạp.
        example: "2026"
      - name: thang
        type: int
        header: THÁNG
        label: THÁNG
        meaning: Tháng may mẫu.
        example: "9"
      - name: nhom
        type: text
        header: NHÓM
        label: NHÓM
        normalize: clean_text
        meaning: Nhóm kinh doanh phụ trách, ghi như trong tệp.
        example: SALE 6
      - name: khach_hang
        type: text
        required: true
        header: KHÁCH HÀNG
        label: KHÁCH HÀNG
        display_width: 280
        normalize: clean_text
        meaning: Tên khách hàng mà mẫu được chào cho, ghi như trong tệp.
        example: MANGO MNG, S.A.
      - name: men_lady_others
        type: text
        header: MEN / LADY / OTHERS
        label: MEN / LADY / OTHERS
        normalize: clean_text
        meaning: Mẫu dành cho nam, nữ hay đối tượng khác.
        example: MEN
      - name: sample_description
        type: text
        header: SAMPLE DESCRIPTION
        label: SAMPLE DESCRIPTION
        display_width: 240
        normalize: clean_text
        meaning: Mô tả mẫu, ghi như trong tệp.
        example: BLAZER - Mockup interlining
      - name: don_gia
        type: number
        header: ĐƠN GIÁ
        label: ĐƠN GIÁ
        meaning: Đơn giá một mẫu, tính bằng USD. Ô không phải số thì để trống.
        example: "37.5"
      - name: so_luong
        type: number
        role: measure
        header: SỐ LƯỢNG
        label: SỐ LƯỢNG
        meaning: Số lượng mẫu của lần may này.
        example: "1"
      - name: thanh_tien_usd
        type: number
        header: THÀNH TIỀN USD
        label: THÀNH TIỀN USD
        meaning: Thành tiền của dòng, tính bằng USD, như trong tệp.
        example: "75"
      - name: thanh_tien_vnd
        type: number
        header: THÀNH TIỀN VNĐ
        label: THÀNH TIỀN VNĐ
        meaning: Thành tiền của dòng, tính bằng đồng Việt Nam, như trong tệp.
        example: "1800000"
