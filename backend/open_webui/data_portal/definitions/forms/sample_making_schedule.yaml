# =============================================================================
#  Bộ bảng LICH_MAY_MAU — May mẫu (nhóm HQ-MAU-GC)
#
#  Tệp NBC: "SAMPLE MAKING SCHEDULE ( 30 Sep ) - OK.xlsx". Bộ đọc
#  `sources/header_table.py` nhận sheet đang hiện **theo dòng tiêu đề** (tên sheet đổi
#  theo ngày): dòng có đủ 6 tên cột dưới đây — dòng 12, dòng tên cột tiếng Anh.
#  Dữ liệu từ dòng tiêu đề + 2; bỏ dòng ẩn, dừng ở dòng đang hiện trống đầu tiên, bỏ
#  dòng tổng.
#
#  Chỉ lấy các cột chứa thông tin NBC hiện cần: CUSTOMER, MEN / LADY,
#  SAMPLE DESCRIPTION, SALE GROUP, QTY, PRICE / PC ( USD ). Tên biến theo phiếu khảo
#  sát 20260915_NBC-QTTM_Bieu_mau_du_lieu_va_Khao_sat sheet "4. May mau"; cột phiếu
#  chưa có tên thì giữ tên cột gốc (men_lady) hoặc đặt theo yêu cầu (sample, description).
#
#  Bronze giữ y như tệp. Silver làm sạch chữ và chuẩn hoá theo `normalize`:
#    clean_text     gộp khoảng trắng, xuống dòng; ô trống → "Không có thông tin"
#    customer_code  tên khách → mã khách theo definitions/customer_aliases.yaml
#    sales_group    6 → SALE 6, cùng dạng nhóm kinh doanh của HQKD
#    split_head     SAMPLE DESCRIPTION: phần trước dấu " - " đầu tiên
#    split_tail     SAMPLE DESCRIPTION: phần sau dấu " - " đầu tiên
#
#  Ô P10 (SUBTOTAL của cột QTY) chỉ cộng dòng đang hiện, phải bằng tổng so_luong.
#  Nạp lại cùng năm: ghi đè toàn bộ năm đó (`merge: replace_all`).
# =============================================================================

form:
  code: LICH_MAY_MAU
  version: 2
  label: May mẫu
  subtitle: SAMPLE MAKING SCHEDULE
  description: Lịch may mẫu chào hàng — khách hàng, nhóm kinh doanh, sample, số lượng và đơn giá.
  policy:
    unknown_sheet: ignore
    unknown_column: ignore
  source:
    kind: header_table
    data_row_offset: 2
    total_cell: P10
    report_date_cell: A4
    required_headers: [CUSTOMER, MEN / LADY, SAMPLE DESCRIPTION, SALE GROUP, QTY, PRICE / PC ( USD )]

tables:
  - name: fact_may_mau
    kind: fact
    sheet: LICH_MAY_MAU
    label: May mẫu chào hàng
    card_label: May mẫu chào hàng
    description: Từng lần may mẫu — khách hàng, nhóm kinh doanh, sample, số lượng và đơn giá.
    grain: Một dòng cho mỗi dòng dữ liệu đang hiện của sheet lịch may mẫu.
    purpose: >
      Nhóm câu hỏi về hiệu quả may mẫu chào hàng: chi phí may mẫu theo khách hàng và
      nhóm kinh doanh, so với doanh thu và lợi nhuận của cùng khách hàng ở nhóm HQKD.
    business_key: [nam, ma_khach, sample]
    merge: replace_all
    order: [nam, ma_nhom_kd, ma_khach, sample]
    display_order: 1
    columns:
      - name: nam
        type: int
        value_from: nam_du_lieu
        label: Không có trong tệp — lấy từ ô Năm dữ liệu chọn lúc nạp
        meaning: Năm của số liệu, chọn ở ô Năm dữ liệu lúc nạp.
        example: "2026"
      - name: ma_khach
        type: text
        required: true
        header: CUSTOMER
        label: CUSTOMER
        display_width: 240
        normalize: customer_code
        meaning: >
          Mã khách hàng mà mẫu được chào cho. Tên trong tệp được đổi sang mã theo danh mục
          tên gọi khác của khách hàng; tên chưa có mã giữ nguyên (khách phát triển).
        example: EO-00325
      - name: men_lady
        type: text
        header: MEN / LADY
        label: MEN / LADY
        normalize: clean_text
        meaning: Mẫu dành cho nam hay nữ.
        example: MEN
      - name: sample
        type: text
        header: SAMPLE DESCRIPTION
        label: SAMPLE
        display_width: 160
        normalize: split_head
        meaning: Phần trước dấu "-" của SAMPLE DESCRIPTION.
        example: BLAZER
      - name: description
        type: text
        label: DESCRIPTION
        display_width: 240
        normalize:
          rule: split_tail
          from: sample
        meaning: Phần sau dấu "-" của SAMPLE DESCRIPTION; không có thì "Không có thông tin".
        example: Mockup thread
      - name: ma_nhom_kd
        type: text
        header: SALE GROUP
        label: SALE GROUP
        normalize: sales_group
        meaning: Nhóm kinh doanh phụ trách, cùng dạng với HQKD (số 6 thành SALE 6).
        example: SALE 6
      - name: so_luong
        type: number
        role: measure
        header: QTY
        label: QTY
        meaning: Số lượng mẫu của lần may này.
        example: "1"
      - name: don_gia_usd
        type: number
        header: PRICE / PC ( USD )
        label: PRICE / PC ( USD )
        meaning: Đơn giá một mẫu, tính bằng USD. Ô không phải số (vd. "X") thì để trống.
        example: "37.5"
