# =============================================================================
#  Bộ bảng DON_GIA_CONG — Đơn gia công ngoài (nhóm HQ-MAU-GC)
#
#  Tệp NBC: "TOTAL PO SUBCON.xlsx" (9 sheet, 6 sheet ẩn). Bộ đọc
#  `sources/header_table.py` nhận sheet **theo dòng tiêu đề**: sheet đang
#  hiện có đủ 7 cột cần lấy (sheet ẩn "Fty update" cũng có đủ cột nhưng không
#  tính). Dữ liệu từ dòng ngay dưới dòng tiêu đề tới trước dòng trống đầu tiên.
#  Dòng 1 là các ô tổng (SUBTOTAL), chỉ dùng để đối chiếu (QT-16, 18.2 b).
#
#  Cột theo phiếu khảo sát sheet "5. Gia cong ngoai" (Bảng D) và đặc tả mục 10.3.
#  Cột trong phiếu mà tệp không có thì giữ cột, để trống (QT-21).
#
#  Nạp lại cùng năm: ghi đè toàn bộ (`merge: replace_all`, QT-10).
# =============================================================================

form:
  code: DON_GIA_CONG
  version: 1
  label: Đơn gia công ngoài
  subtitle: TOTAL PO SUBCON
  description: Đơn giao xưởng gia công ngoài — đơn vị gia công, mã hàng, đơn hàng, màu, sản lượng.
  policy:
    unknown_sheet: ignore
    unknown_column: ignore
  source:
    kind: bang_theo_tieu_de
    data_row_offset: 1
    total_cell: P1               # ô SUBTOTAL của cột Order qty — phải bằng tổng so_luong

tables:
  - name: fact_gia_cong
    kind: fact
    sheet: DON_GIA_CONG
    label: Đơn gia công ngoài
    card_label: Đơn gia công ngoài
    description: Từng dòng đơn giao xưởng gia công, sản lượng và hai mức giá.
    grain: Một dòng cho mỗi đợt giao của một đơn vị gia công cho một mã hàng, một đơn hàng, một màu.
    purpose: >
      Nhóm câu hỏi về hiệu quả gia công ngoài: tổng sản lượng và số đơn vị gia công
      trong kỳ, và các đơn có giá trị lỗ do giá gia công cao hơn giá chào hàng.
    business_key: [nam, ma_don_vi_gc, ma_hang]
    merge: replace_all
    order: [nam, ma_don_vi_gc, ma_hang, ma_don_hang]
    display_order: 1
    columns:
      - name: nam
        type: int
        value_from: nam_du_lieu
        label: Không có trong tệp — lấy từ ô Năm dữ liệu chọn lúc nạp
        meaning: Năm của số liệu, chọn ở ô Năm dữ liệu lúc nạp.
        example: "2026"
      - name: ma_dong
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Mã riêng của một dòng đơn. Tệp không có cột này nên để trống.
      - name: ky_thang
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Kỳ mà dòng đơn thuộc về. Mốc xác định kỳ chưa thống nhất (phiếu khảo sát sheet 7, mục 6) nên để trống.
      - name: ma_don_vi_gc
        type: text
        required: true
        header: Subcon
        label: Subcon
        meaning: Đơn vị gia công nhận đơn, giữ nguyên tên trong tệp.
        example: NT
      - name: khu_vuc
        type: text
        header: Location
        label: Location
        meaning: Khu vực của đơn vị gia công.
        example: HA NAM
      - name: ma_khach
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Mã khách hàng của đơn hàng. Tệp chỉ có tên khách nên để trống.
      - name: ten_khach
        type: text
        header: BUYER
        label: BUYER
        meaning: Tên khách hàng của đơn hàng.
        example: FAM
      - name: ma_nhom_kd
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Nhóm kinh doanh phụ trách. Cột SALES của tệp ghi tên người nên để trống.
      - name: ma_hang
        type: text
        required: true
        header: Style
        label: Style
        meaning: Mã hàng của đơn.
        example: OR015554
      - name: ma_don_hang
        type: text
        header: PO No
        label: PO No
        meaning: Mã đơn hàng hoặc mã PO.
        example: Q10950
      - name: mau
        type: text
        header: Color
        label: Color
        meaning: Màu của dòng đơn.
        example: RIO RED LAND PLAID
      - name: so_luong
        type: number
        role: measure
        header: Order qty
        label: Order qty
        meaning: Số lượng sản phẩm của dòng đơn.
        example: "2802"
      - name: don_gia_gia_cong
        type: number
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Đơn giá trả cho đơn vị gia công, tính trên một sản phẩm. Tệp không có cột này nên để trống.
      - name: don_gia_chao_hang
        type: number
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Đơn giá chào khách của cùng mã hàng. Tệp không có cột này nên để trống.
      - name: ma_tien_te
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Đơn vị tiền của hai đơn giá. Tệp không có nên để trống.
      - name: loai_ban_ghi
        type: text
        value_from: trong
        label: Không có trong tệp — để trống
        meaning: Dòng này là số kế hoạch hay số thực hiện. Tệp không có nên để trống.
